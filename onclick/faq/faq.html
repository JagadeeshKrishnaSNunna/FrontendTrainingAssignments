<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ Section</title>
  <link rel="stylesheet" href="faq.css">
</head>
<body>
  <section class="faq-section">
    <h2>Have Questions?</h2>
    <p>Get quick answers to common questions about our Rewards Program.</p>

    <div class="faq-item">
      <button class="faq-question">
        <span>Rewards FAQ</span>
        <span class="arrow">^</span>
      </button>
      <div class="faq-answer">
        <p>
          Here you can add your FAQ answer. It will expand when the user clicks the row.
        </p>
      </div>
    </div>
  </section>

  <script src="faq.js">
    
  </script>
</body>
</html>
